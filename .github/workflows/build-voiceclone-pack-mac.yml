name: Build Pre-Bundled macOS Voice Clone Pack

on:
  workflow_dispatch:
    inputs:
      include_models:
        description: 'Pre-download AI weights into the bundle (F5-TTS & Whisper)'
        required: false
        type: boolean
        default: true
      publish_release:
        description: 'Publish as GitHub Release Asset'
        required: false
        type: boolean
        default: false
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        type: string
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  bundle-mac-arm64:
    name: macOS Apple Silicon (M1/M2/M3/M4) Bundle
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Portable Relocatable Python 3.11 (ARM64)
        run: |
          mkdir -p build_pack/VoiceClonePack
          cd build_pack/VoiceClonePack
          echo "[*] Downloading standalone relocatable Python for Apple Silicon..."
          curl -L -o python-arm64.tar.gz https://github.com/astral-sh/python-build-standalone/releases/download/20240814/cpython-3.11.9+20240814-aarch64-apple-darwin-install_only.tar.gz
          tar -xzf python-arm64.tar.gz
          rm python-arm64.tar.gz
          mv python .venv
          chmod -R +x .venv/bin

      - name: Install PyTorch (Apple Metal MPS) and AI Dependencies
        run: |
          cd build_pack/VoiceClonePack
          ./.venv/bin/python3 -m pip install --upgrade pip setuptools wheel
          ./.venv/bin/python3 -m pip install torch torchvision torchaudio
          ./.venv/bin/python3 -m pip install f5-tts faster-whisper soundfile imageio_ffmpeg pydub

      - name: Pre-Download AI Model Weights
        if: ${{ github.event.inputs.include_models != 'false' }}
        run: |
          cd build_pack/VoiceClonePack
          mkdir -p models/hub
          export HF_HOME="$(pwd)/models"
          echo "[*] Pre-caching F5-TTS and Whisper models..."
          ./.venv/bin/python3 -c "
          import os
          from f5_tts.api import F5TTS
          from faster_whisper import WhisperModel
          print('[*] Caching F5-TTS...')
          F5TTS(device='cpu')
          print('[*] Caching Faster-Whisper tiny...')
          WhisperModel('tiny', download_root='models/hub')
          print('[✓] AI models cached successfully!')
          "

      - name: Assemble VoiceClonePack
        run: |
          mkdir -p build_pack/VoiceClonePack
          if [ -f "VoiceClonePack/service.py" ]; then
            cp VoiceClonePack/service.py build_pack/VoiceClonePack/service.py
          elif [ -f "backend/voice_clone_service.py" ]; then
            cp backend/voice_clone_service.py build_pack/VoiceClonePack/service.py
          fi
          for f in start_service.sh install_service.sh Install_Voice_Clone.command README.md; do
            if [ -f "VoiceClonePack/$f" ]; then
              cp "VoiceClonePack/$f" "build_pack/VoiceClonePack/$f"
            fi
          done
          chmod +x build_pack/VoiceClonePack/*.sh 2>/dev/null || true
          chmod +x build_pack/VoiceClonePack/*.command 2>/dev/null || true
          chmod -R +x build_pack/VoiceClonePack/.venv/bin 2>/dev/null || true

      - name: Verify Bundle & Apple Metal MPS Support
        run: |
          cd build_pack/VoiceClonePack
          ./.venv/bin/python3 -c "
          import torch, f5_tts, faster_whisper, soundfile
          mps = hasattr(torch.backends, 'mps') and torch.backends.mps.is_available()
          print(f'[✓] Bundle Verified! Metal (MPS) GPU Support: {mps}')
          "

      - name: Compress Pre-Bundled Package
        run: |
          cd build_pack
          zip -r ../VoiceClonePack-mac-arm64.zip VoiceClonePack

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoiceClonePack-mac-arm64
          path: VoiceClonePack-mac-arm64.zip
          retention-days: 14

  bundle-mac-x64:
    name: macOS Intel (x64) Bundle
    runs-on: macos-13
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Portable Relocatable Python 3.11 (x64)
        run: |
          mkdir -p build_pack/VoiceClonePack
          cd build_pack/VoiceClonePack
          echo "[*] Downloading standalone relocatable Python for Intel Mac..."
          curl -L -o python-x64.tar.gz https://github.com/astral-sh/python-build-standalone/releases/download/20240814/cpython-3.11.9+20240814-x86_64-apple-darwin-install_only.tar.gz
          tar -xzf python-x64.tar.gz
          rm python-x64.tar.gz
          mv python .venv
          chmod -R +x .venv/bin

      - name: Install PyTorch and AI Dependencies
        run: |
          cd build_pack/VoiceClonePack
          ./.venv/bin/python3 -m pip install --upgrade pip setuptools wheel
          ./.venv/bin/python3 -m pip install torch torchvision torchaudio
          ./.venv/bin/python3 -m pip install f5-tts faster-whisper soundfile imageio_ffmpeg pydub

      - name: Pre-Download AI Model Weights
        if: ${{ github.event.inputs.include_models != 'false' }}
        run: |
          cd build_pack/VoiceClonePack
          mkdir -p models/hub
          export HF_HOME="$(pwd)/models"
          echo "[*] Pre-caching F5-TTS and Whisper models..."
          ./.venv/bin/python3 -c "
          import os
          from f5_tts.api import F5TTS
          from faster_whisper import WhisperModel
          print('[*] Caching F5-TTS...')
          F5TTS(device='cpu')
          print('[*] Caching Faster-Whisper tiny...')
          WhisperModel('tiny', download_root='models/hub')
          print('[✓] AI models cached successfully!')
          "

      - name: Assemble VoiceClonePack
        run: |
          mkdir -p build_pack/VoiceClonePack
          if [ -f "VoiceClonePack/service.py" ]; then
            cp VoiceClonePack/service.py build_pack/VoiceClonePack/service.py
          elif [ -f "backend/voice_clone_service.py" ]; then
            cp backend/voice_clone_service.py build_pack/VoiceClonePack/service.py
          fi
          for f in start_service.sh install_service.sh Install_Voice_Clone.command README.md; do
            if [ -f "VoiceClonePack/$f" ]; then
              cp "VoiceClonePack/$f" "build_pack/VoiceClonePack/$f"
            fi
          done
          chmod +x build_pack/VoiceClonePack/*.sh 2>/dev/null || true
          chmod +x build_pack/VoiceClonePack/*.command 2>/dev/null || true
          chmod -R +x build_pack/VoiceClonePack/.venv/bin 2>/dev/null || true

      - name: Compress Pre-Bundled Package
        run: |
          cd build_pack
          zip -r ../VoiceClonePack-mac-x64.zip VoiceClonePack

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoiceClonePack-mac-x64
          path: VoiceClonePack-mac-x64.zip
          retention-days: 14

  publish-release:
    name: Publish Release Assets
    needs: [bundle-mac-arm64, bundle-mac-x64]
    if: ${{ github.event.inputs.publish_release == true || github.event.inputs.publish_release == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download Mac ARM64 Artifact
        uses: actions/download-artifact@v4
        with:
          name: VoiceClonePack-mac-arm64
          merge-multiple: true

      - name: Download Mac x64 Artifact
        uses: actions/download-artifact@v4
        with:
          name: VoiceClonePack-mac-x64
          merge-multiple: true

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          files: |
            VoiceClonePack-mac-arm64.zip
            VoiceClonePack-mac-x64.zip
