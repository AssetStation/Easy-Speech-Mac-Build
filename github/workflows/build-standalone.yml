name: Build macOS Standalone Engines

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release'
        required: false
        type: boolean
        default: false
      tag_name:
        description: 'Release Tag (required if publishing release via manual run, e.g. v1.0.0)'
        required: false
        type: string
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-mac-arm64:
    name: macOS Apple Silicon (M1/M2/M3/M4) Engine
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f ".github/workflows/requirements.txt" ]; then
            pip install -r .github/workflows/requirements.txt
          elif [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          fi

      - name: Compile macOS ARM64 Standalone Engine
        run: |
          python build_standalone.py

      - name: Set Permissions & Ad-hoc Sign
        run: |
          chmod -R +x bin/mac/engine_arm64
          codesign --force --deep --sign - bin/mac/engine_arm64/engine

      - name: Compress macOS ARM64 Engine
        run: |
          cd bin/mac
          zip -r ../../easyspeech-engine-mac-arm64.zip engine_arm64

      - name: Upload macOS ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: easyspeech-engine-mac-arm64
          path: easyspeech-engine-mac-arm64.zip

  build-mac-x64:
    name: macOS Intel Engine
    runs-on: macos-13
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f ".github/workflows/requirements.txt" ]; then
            pip install -r .github/workflows/requirements.txt
          elif [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          fi

      - name: Compile macOS Intel Standalone Engine
        run: |
          python build_standalone.py

      - name: Set Permissions & Ad-hoc Sign
        run: |
          chmod -R +x bin/mac/engine_x64
          codesign --force --deep --sign - bin/mac/engine_x64/engine

      - name: Compress macOS Intel Engine
        run: |
          cd bin/mac
          zip -r ../../easyspeech-engine-mac-x64.zip engine_x64

      - name: Upload macOS Intel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: easyspeech-engine-mac-x64
          path: easyspeech-engine-mac-x64.zip

  publish-release:
    name: Publish GitHub Release Assets
    needs: [build-mac-arm64, build-mac-x64]
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == true || github.event.inputs.create_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download Mac ARM64 Artifact
        uses: actions/download-artifact@v4
        with:
          name: easyspeech-engine-mac-arm64
          merge-multiple: true

      - name: Download Mac Intel Artifact
        uses: actions/download-artifact@v4
        with:
          name: easyspeech-engine-mac-x64
          merge-multiple: true

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          files: |
            easyspeech-engine-mac-arm64.zip
            easyspeech-engine-mac-x64.zip
          generate_release_notes: true
